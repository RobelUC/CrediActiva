<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrediActiva — Guía de estilos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/crediactiva.css" rel="stylesheet" />
  </head>
  <body class="p-5">
    <header class="mb-5">
      <h1 class="text-crediactiva-navy">CrediActiva</h1>
      <p class="lead text-muted">Cooperativa de Crédito · Huancayo, Perú</p>
    </header>

    <section class="mb-4">
      <h2 class="h5">Botones Bootstrap (marca aplicada)</h2>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-primary">Acción principal (.btn-primary)</button>
        <button type="button" class="btn btn-success">Éxito / crecimiento (.btn-success)</button>
      </div>
    </section>

    <section class="mb-4">
      <h2 class="h5">Clases semánticas CrediActiva</h2>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-crediactiva-primary">Solicitar crédito</button>
        <button type="button" class="btn btn-crediactiva-success">Ahorro programado</button>
        <button type="button" class="btn btn-outline-crediactiva-primary">Más información</button>
        <button type="button" class="btn btn-outline-crediactiva-success">Simular préstamo</button>
      </div>
    </section>

    <section>
      <h2 class="h5">Paleta</h2>
      <div class="d-flex gap-3">
        <div class="p-4 rounded text-white bg-crediactiva-navy">Azul marino #002855</div>
        <div class="p-4 rounded text-white bg-crediactiva-forest">Verde bosque #00703C</div>
      </div>
    </section>
  </body>
</html>
