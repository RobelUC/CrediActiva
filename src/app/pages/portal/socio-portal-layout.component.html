<div class="portal-layout" [class.portal-layout--menu-abierto]="menuAbierto()">
  <header class="portal-mobile-bar">
    <button
      type="button"
      class="portal-mobile-bar__toggle"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="portal-sidebar"
      aria-label="Abrir menú de navegación"
      (click)="toggleMenu()"
    >
      <i class="bi" [class.bi-list]="!menuAbierto()" [class.bi-x-lg]="menuAbierto()"></i>
    </button>

    <a class="portal-mobile-bar__brand" routerLink="/" (click)="cerrarMenu()">
      <img
        class="portal-mobile-bar__logo"
        src="assets/images/crediactiva-logo.png"
        alt="CrediActiva"
        width="36"
        height="36"
      />
      <span>Portal del socio</span>
    </a>
  </header>

  @if (menuAbierto()) {
    <button
      type="button"
      class="portal-sidebar__overlay"
      aria-label="Cerrar menú"
      (click)="cerrarMenu()"
    ></button>
  }

  <aside
    id="portal-sidebar"
    class="portal-sidebar"
    [class.portal-sidebar--abierto]="menuAbierto()"
  >
    <div class="portal-sidebar__header">
      <a class="portal-sidebar__brand" routerLink="/" (click)="cerrarMenu()">
        <img
          class="portal-sidebar__logo"
          src="assets/images/crediactiva-logo.png"
          alt="CrediActiva"
          width="44"
          height="44"
        />
        <span class="portal-sidebar__brand-text">CREDI ACTIVA</span>
      </a>
      <button
        type="button"
        class="portal-sidebar__cerrar"
        aria-label="Cerrar menú"
        (click)="cerrarMenu()"
      >
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <p class="portal-sidebar__tag">Portal del socio</p>

    @if (auth.usuario(); as u) {
      <div class="portal-sidebar__user">
        <i class="bi bi-person-circle"></i>
        <div>
          <strong>{{ u.nombres }} {{ u.apellidos }}</strong>
          <small>DNI {{ u.dni }}</small>
        </div>
      </div>
    }

    <nav class="portal-sidebar__nav">
      <a
        routerLink="/portal"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()"
      >
        <i class="bi bi-house-door"></i> Resumen de cuenta
      </a>
      <a routerLink="/portal/creditos" routerLinkActive="active" (click)="cerrarMenu()">
        <i class="bi bi-credit-card"></i> Mis créditos
      </a>
      <a routerLink="/portal/aportes" routerLinkActive="active" (click)="cerrarMenu()">
        <i class="bi bi-clock-history"></i> Historial aportes
      </a>
      <a routerLink="/portal/contactos" routerLinkActive="active" (click)="cerrarMenu()">
        <i class="bi bi-telephone"></i> Contactos
      </a>
      <a routerLink="/portal/soporte" routerLinkActive="active" (click)="cerrarMenu()">
        <i class="bi bi-headset"></i> Soporte técnico
      </a>
      <a routerLink="/portal/perfil" routerLinkActive="active" (click)="cerrarMenu()">
        <i class="bi bi-person-gear"></i> Perfil de usuario
      </a>
      <a routerLink="/simulador" class="portal-sidebar__nav-sim" (click)="cerrarMenu()">
        <i class="bi bi-calculator"></i> Simular crédito
      </a>
    </nav>

    <button type="button" class="btn btn-sm btn-outline-light mt-auto" (click)="cerrarSesion()">
      Cerrar sesión
    </button>
  </aside>

  <main class="portal-main">
    <router-outlet />
  </main>
</div>
